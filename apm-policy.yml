# Política de APM de la organización elpalmeral-org (ADR 0023).
# APM la descubre sola en cada `apm install` de cualquier repo de la org: gobierna qué paquetes de
# agentes, servidores MCP y herramientas se pueden instalar. Se cambia por PR en este repo.
# El esquema es experimental en APM: la plataforma fija la versión de APM en CI (0.35.0).
name: "Política de agentes de elpalmeral-org"
version: "1.0.0"
enforcement: block

dependencies:
  # Solo paquetes de la propia organización.
  allow:
    - "elpalmeral-org/**"
  # El harness corporativo es obligatorio en todo repo que use APM.
  require:
    - "elpalmeral-org/platform-harness"
  # Siempre una versión cerrada: tag o SHA, nunca una rama.
  require_pinned_constraint: true
  max_depth: 3

mcp:
  # Solo servidores remotos por HTTP, y solo los aprobados.
  transport:
    allow:
      - http
  allow:
    - "port"
  self_defined: warn
  trust_transitive: false

compilation:
  target:
    allow:
      - claude
      - copilot
      - codex
      - opencode

unmanaged_files:
  action: warn
